# CoRE Stack Village Analytics Tool (CSVAT)
# Docker Compose for full-stack deployment

services:
  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: csvat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: csvat_db
      POSTGRES_USER: csvat
      POSTGRES_PASSWORD: csvat_pass
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-init on first boot: schema + village stories seed
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/docker/init-db.sh:/docker-entrypoint-initdb.d/02-seed.sh:ro
      - ./backend/app/data/village_stories_batch_1_output.json:/docker-entrypoint-initdb.d/village_stories_batch_1_output.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U csvat -d csvat_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csvat_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata: