# CoRE Stack Village Analytics Tool (CSVAT)
# Docker Compose for full-stack deployment

services:
  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: csvat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: csvat_db
      POSTGRES_USER: csvat
      POSTGRES_PASSWORD: csvat_pass
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U csvat -d csvat_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csvat_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  # Redis for Celery Broker & Result Backend
  redis:
    image: redis:7-alpine
    container_name: csvat_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csvat_worker
    restart: unless-stopped
    command: [ "celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info" ]
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

volumes:
  pgdata:
  redisdata:
